<div class="filesapp">
  <header class="fb-head">
    <select class="fb-peer" aria-label="Whose share" title="Whose shared folder to browse">
      <option value="">My share</option>
    </select>
    <nav class="fb-crumbs" aria-label="Path"></nav>
    <div class="fb-actions">
      <label class="fb-upload" title="Upload a file into this folder">
        <input type="file" class="fb-file" multiple>
        <span>Upload</span>
      </label>
    </div>
  </header>

  <div class="fb-status" role="status" aria-live="polite"></div>

  <main class="fb-list" aria-label="Directory listing">
    <div class="fb-empty">Loading…</div>
  </main>

  <footer class="fb-foot">
    <span class="fb-dav">Connect via WebDAV: <code>/files/dav</code></span>
  </footer>
</div>
